<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f0e7" />
    <title>Page not found — Nikos Mavrapidis</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
        background: #f5f0e7;
        color: #171713;
        font-family: "DM Sans", Arial, sans-serif;
      }
      main { max-width: 620px; }
      p.kicker {
        margin: 0 0 18px;
        color: #b33d14;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 22px;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.95;
      }
      h1 span { color: #eb5e2a; }
      p { margin: 0 0 32px; color: #615e56; font-size: 18px; line-height: 1.5; }
      a {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        padding: 0 22px;
        background: #244ed8;
        color: #fffdf8;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #244ed8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404 · Page not found</p>
      <h1>This page doesn’t exist<span>.</span></h1>
      <p>The link may be outdated, or the page may have moved.</p>
      <a href="/">Back to the portfolio →</a>
    </main>
  </body>
</html>
